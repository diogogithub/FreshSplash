<!DOCTYPE html>
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>Fresh Splash</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.diogo.site/projects/excalibur_template/assets/css/main.css">
<style>
	.upload-btn-wrapper {
	  position: relative;
	  overflow: hidden;
	  display: inline-block;
	}
	.btn {
	  border: 2px solid gray;
	  color: gray;
	  background-color: white;
	  padding: 8px 20px;
	  border-radius: 8px;
	  font-size: 20px;
	  font-weight: bold;
	}
	.upload-btn-wrapper input[type=file] {
	  font-size: 100px;
	  position: absolute;
	  left: 0;
	  top: 0;
	  opacity: 0;
	}
</style>
</head>
<body>
	<h1>Fresh Splash Dashboard</h1>
	<p>Add a wallpaper to this Fresh Splash server by just clicking on the button below.</p>
	<div class="upload-btn-wrapper">
		<form action="upload.php">
			<button class="btn">Upload a file</button>
			<input type="file" name="myfile" onchange="this.form.submit()">
		</form>
	</div>
</body>
</html>
