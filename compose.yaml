services:
  freshsplash:
    build: .
    ports:
      - "${FRESHSPLASH_PORT:-8080}:80"
    env_file:
      - .env
    volumes:
      - freshsplash-data:/var/www/html/var
      - freshsplash-uploads:/var/www/html/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/api/health.php\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  freshsplash-data:
  freshsplash-uploads:
